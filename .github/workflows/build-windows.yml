name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - fix/gitlab-duo-compaction-boundaries

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: Install Windows native addon
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -e 'const p = await Bun.file("packages/natives/package.json").json(); console.log(p.version)')"
          package="@oh-my-pi/pi-natives-win32-x64@${version}"
          npm pack "$package" --pack-destination "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/pi-natives-win32-x64-${version}.tgz"
          extract_dir="$RUNNER_TEMP/pi-natives-win32-x64"
          mkdir -p "$extract_dir"
          tar -xzf "$tarball" -C "$extract_dir"
          addon="$(find "$extract_dir/package" -type f -name 'pi_natives.win32-x64*.node' -print -quit)"
          test -n "$addon"
          mkdir -p packages/natives/native
          cp "$addon" packages/natives/native/pi_natives.win32-x64-baseline.node

      - name: Build Windows binary
        env:
          RELEASE_TARGETS: win32-x64
        run: bun run ci:release:build-binaries

      - uses: actions/upload-artifact@v4
        with:
          name: omp-windows-x64
          path: packages/coding-agent/binaries/omp-windows-x64.exe
